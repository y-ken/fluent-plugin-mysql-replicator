# E2E pipeline: MySQL (in_mysql_replicator) -> Elasticsearch (out_mysql_replicator_elasticsearch)
# Connection details are injected via environment variables so the same config
# works both in CI and locally. See test/e2e/replication_e2e_test.rb.
<source>
  @type mysql_replicator
  host "#{ENV['MYSQL_HOST'] || '127.0.0.1'}"
  port "#{ENV['MYSQL_PORT'] || '3306'}"
  username "#{ENV['MYSQL_USER'] || 'root'}"
  password "#{ENV['MYSQL_PASSWORD'] || 'root'}"
  database "#{ENV['MYSQL_DATABASE'] || 'e2e_source'}"
  query SELECT id, name, age, profile FROM users
  primary_key id
  json_columns profile
  interval 2s
  enable_delete true
  tag myindex.mytype.${event}.${primary_key}
</source>

<match myindex.**>
  @type mysql_replicator_elasticsearch
  host "#{ENV['ES_HOST'] || '127.0.0.1'}"
  port "#{ENV['ES_PORT'] || '9200'}"
  # The test deletes this template before it starts, so the plugin installs it again. Elasticsearch 6.x has only the
  # legacy API (PUT /_template); 7.17 and later get the composable one (PUT /_index_template), the default.
  template_name mysql_replicator_e2e
  use_legacy_template "#{(ENV['ES_MAJOR_VERSION'] || '6').to_i < 7}"
  template_file "#{(ENV['ES_MAJOR_VERSION'] || '6').to_i < 7 ? 'test/e2e/template_legacy.json' : 'test/e2e/template_composable.json'}"
  <buffer>
    @type memory
    flush_mode interval
    flush_interval 1s
    flush_thread_count 1
  </buffer>
</match>
